<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Calculadora</h1>

      <div class="form">
        <div class="display">
          <p class="operation" id="operation"></p>
          <p class="result" id="result"></p>
        </div>

        <div class="calculator">
          <div class="numbers">
            <!-- Borrar y algunos simbolos más -->
            <button value="CA" class="numbers__item borradores" id="borrarTotal">CA</button>
            <button value="C" class="numbers__item" id="borrarParcial">C</button>
            <button value="%" class="numbers__item cambiarOperador">%</button>
            <button value="/" class="numbers__item cambiarOperador">/</button>

            <button value="7" class="numbers__item seleccionar__numero">7</button>
            <button value="8" class="numbers__item seleccionar__numero">8</button>
            <button value="9" class="numbers__item seleccionar__numero">9</button>

            <button value="*" class="numbers__item cambiarOperador">*</button>

            <button value="4" class="numbers__item seleccionar__numero">4</button>
            <button value="5" class="numbers__item seleccionar__numero">5</button>
            <button value="6" class="numbers__item seleccionar__numero">6</button>

            <button value="+" class="numbers__item cambiarOperador">+</button>

            <button value="1" class="numbers__item seleccionar__numero">1</button>
            <button value="2" class="numbers__item seleccionar__numero">2</button>
            <button value="3" class="numbers__item seleccionar__numero">3</button>

            <button value="-" class="numbers__item cambiarOperador ">-</button>

            <button value="0" class="numbers__item seleccionar__numero">0</button>

            <button value="." class="numbers__item seleccionar__numero">.</button>

            <button value="=" class="numbers__item item__igual" id="igual">=</button>
          </div>
        </div>
      </div>
    </div>

    <script src="codigo.js"></script>
  </body>
</html>
